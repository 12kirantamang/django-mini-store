{% extends "products/base.html" %}
{% block content %}
<div class="container padding-large">
  <h2>CSVインポート</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="csv_file" accept=".csv" class="form-control mb-3">
    <button type="submit" class="btn btn-dark">アップロード</button>
  </form>
</div>
{% endblock %}
