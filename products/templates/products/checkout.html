{% extends "products/base.html" %}
{% load static %}
{% block content %}
<section id="checkout" class="padding-large">
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        <h2 class="display-7 text-dark text-uppercase mb-4">Checkout</h2>
        
        <form method="POST" action="{% url 'process_checkout' %}">
          {% csrf_token %}
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Full Name</label>
              <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label>Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>
          </div>
          
          <div class="mb-3">
            <label>Phone</label>
            <input type="tel" name="phone" class="form-control" required>
          </div>
          
          <div class="mb-3">
            <label>Address</label>
            <textarea name="address" class="form-control" rows="3" required></textarea>
          </div>
          
          <div class="row">
            <div class="col-md-4 mb-3">
              <label>City</label>
              <input type="text" name="city" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label>Postal Code</label>
              <input type="text" name="postal_code" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label>Country</label>
              <input type="text" name="country" class="form-control" required>
            </div>
          </div>
          
          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'cart' %}" class="btn btn-medium btn-outline-dark">Back to Cart</a>
            <button type="submit" class="btn btn-medium btn-dark">Place Order</button>
          </div>
        </form>
      </div>
      
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">
            <h4>Order Summary</h4>
          </div>
          <div class="card-body">
            {% for item in cart_items %}
            <div class="d-flex justify-content-between mb-2">
              <span>{{ item.product.name }} x {{ item.quantity }}</span>
              <span>${{ item.total_price }}</span>
            </div>
            {% endfor %}
            <hr>
            <div class="d-flex justify-content-between">
              <strong>Total:</strong>
              <strong>${{ total }}</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
