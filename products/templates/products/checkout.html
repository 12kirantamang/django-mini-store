{% extends "products/base.html" %}
{% load static %}
{% block content %}
<section id="checkout" class="padding-large">
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        <h2 class="display-7 text-dark text-uppercase mb-4">チェックアウト</h2>
        
        <form method="POST" action="{% url 'process_checkout' %}">
          {% csrf_token %}
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>氏名</label>
              <input type="text" name="full_name" value="{{ user.get_full_name }}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label>メールアドレス</label>
              <input type="email" name="email" value="{{ user.email }}" class="form-control" required>
            </div>
          </div>
          
          <div class="mb-3">
            <label>電話番号</label>
            <input type="tel" name="phone" class="form-control" required>
          </div>
          
          <div class="mb-3">
            <label>住所</label>
            <textarea name="address" class="form-control" rows="3" required></textarea>
          </div>
          
          <div class="row">
            <div class="col-md-4 mb-3">
              <label>市区町村</label>
              <input type="text" name="city" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label>郵便番号</label>
              <input type="text" name="postal_code" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label>国</label>
              <input type="text" name="country" class="form-control" required>
            </div>
          </div>

          <div class="payment-method-container mt-4 mb-4">
            <h5 class="text-uppercase fw-bold mb-3 small" style="letter-spacing: 1px;">お支払い方法</h5>
            
            <div class="row g-3">
              <div class="col-md-6">
                <input type="radio" class="btn-check" name="payment_method" id="stripe" value="Stripe" checked autocomplete="off">
                <label class="btn btn-outline-secondary w-100 p-3 rounded-3 shadow-sm d-flex align-items-center justify-content-start text-start h-100" for="stripe">
                  <div class="me-3 bg-light rounded p-2 text-dark">
                    <i class="bi bi-credit-card-2-front fs-4"></i>
                  </div>
                  <div>
                    <div class="fw-bold text-dark">クレジットカード</div>
                    <div class="small text-muted">Stripeで安全に決済</div>
                  </div>
                  <i class="bi bi-check-circle-fill ms-auto text-primary d-none-if-unchecked"></i>
                </label>
              </div>

              <div class="col-md-6">
                <input type="radio" class="btn-check" name="payment_method" id="cod" value="COD" autocomplete="off">
                <label class="btn btn-outline-secondary w-100 p-3 rounded-3 shadow-sm d-flex align-items-center justify-content-start text-start h-100" for="cod">
                  <div class="me-3 bg-light rounded p-2 text-dark">
                    <i class="bi bi-truck fs-4"></i>
                  </div>
                  <div>
                    <div class="fw-bold text-dark">代金引換</div>
                    <div class="small text-muted">配達時にお支払い</div>
                  </div>
                  <i class="bi bi-check-circle-fill ms-auto text-primary d-none-if-unchecked"></i>
                </label>
              </div>
            </div>
          </div>
    
          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'cart' %}" class="btn btn-medium btn-outline-dark">カートに戻る</a>
            <button type="submit" class="btn btn-medium btn-dark">注文を確定する</button>
          </div>
        </form>
      </div>
      
      <div class="col-md-4">
        <div class="card">
          <div class="card-header bg-dark text-white">
            <h4 class="mb-0">注文内容の確認</h4>
          </div>
          <div class="card-body">
            {% for item in cart_items %}
            <div class="d-flex justify-content-between mb-2">
              <span>{{ item.product.name }} × {{ item.quantity }}</span>
              <span>¥{{ item.total_price }}</span>
            </div>
            {% endfor %}
            <hr>
            <div class="d-flex justify-content-between">
              <strong>合計金額：</strong>
              <strong>¥{{ total }}</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="stripe-card-element-container" style="display: block;" class="mt-3">
    <label for="card-element">クレジットカード／デビットカード</label>
    <div id="card-element" class="form-control" style="height: 2.4em; padding-top: .7em;"></div>
    <div id="card-errors" role="alert" class="text-danger mt-2"></div>
  </div>

</section>
{% endblock %}
