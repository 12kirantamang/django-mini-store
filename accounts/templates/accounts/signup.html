{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規会員登録</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4e65d1 0%, #904e95 100%);
            --text-dark: #333;
            --text-muted: #666;
            --border-color: #e5e7eb;
        }

        body {
            background-color: #ffffff; /* Pure white background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: var(--text-dark);
        }

        .register-card {
            background: #ffffff;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            /* Subtle shadow to keep it clean on white */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        h2 { 
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .input-group { 
            margin-bottom: 20px; 
            text-align: left;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s;
            background-color: #f9fafb;
        }

        input:focus {
            border-color: #4e65d1;
            background-color: #fff;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: var(--primary-gradient);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .signup-btn:hover {
            opacity: 0.9;
        }

        .footer-link { 
            margin-top: 25px; 
            font-size: 14px; 
            color: var(--text-muted); 
        }

        .footer-link a { 
            color: #4e65d1; 
            text-decoration: none; 
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        /* Alerts */
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
        }
        .alert-error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
        .alert-success { background-color: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>新規会員登録</h2>
        <p class="subtitle">必要事項を入力してください</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            
            <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
            
            <div class="input-group">
                <input type="text" name="username" placeholder="ユーザー名" required autofocus>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="メールアドレス" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="パスワード" required>
            </div>
            <div class="input-group">
                <input type="password" name="confirm_password" placeholder="パスワード（確認用）" required>
            </div>
            
            <button type="submit" class="signup-btn">アカウントを作成する</button>
        </form>
        
        <p class="footer-link">すでにアカウントをお持ちですか？ 
            <a href="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">ログインはこちら</a>
        </p>
    </div>
</body>
</html>
