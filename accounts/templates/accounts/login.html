<!-- accounts/login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page</title>
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body>
   <div class="login-container">
        <div class="login-card">
            <h2>ログイン</h2>
            <p class="subtitle">アカウント情報を入力してログインしてください</p>
            
            {% if messages %}
                {% for message in messages %}
                    <p style="color: #e11d48; font-size: 13px; margin-bottom: 10px;">{{ message }}</p>
                {% endfor %}
            {% endif %}
            
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                {% if form.errors %}
                    <p style="color: #e11d48; font-size: 13px; margin-bottom: 10px;">
                        ユーザー名またはパスワードが正しくありません。再度お試しください。
                    </p>
                {% endif %}

                <div class="input-group">
                    <input type="text" name="username" placeholder="ユーザー名" required autofocus>
                </div>
                
                <div class="input-group password-wrapper">
                    <input type="password" name="password" id="passwordField" placeholder="パスワード" required>
                    <span class="toggle-password" onclick="togglePassword()">👁️</span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> ログイン状態を保存する
                    </label>
                </div>

                <button type="submit" class="sign-in-btn">ログイン</button>
                
                <input type="hidden" name="next" value="{{ next|default:'/' }}">
            </form>

            <p class="footer-text">
                アカウントをお持ちでないですか？ <a href="{% url 'signup' %}">新規登録</a>
            </p>
        </div>
    </div>
    
    <script>
        function togglePassword() {
            var passwordField = document.getElementById("passwordField");
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
